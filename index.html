<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="LIURAME MUSIC">
    <meta name="description"
        content="Loja online LIURAME MUSIC. Descobre álbuns de Afrohouse, Semba, Kizomba e música romântica, consulta os detalhes e calcula o valor total.">
    <meta name="keywords" content="LIURAME MUSIC, loja de música, Afrohouse, Semba, Kizomba, álbuns">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIURAME MUSIC | Loja Online</title>

    <!-- Estilos e biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Cabeçalho e identidade da loja -->
    <header class="cabecalho-loja">
        <div class="marca-loja">
            <img src="imagens/logotipos/logolimusic.png" alt="Logótipo da LIURAME MUSIC" class="logo-loja">
            <div class="texto-marca">
                <h1>LIURAME MUSIC</h1>
                <p>Loja Online</p>
            </div>
        </div>
    </header>

    <main>
        <!-- Filtro de categorias preenchido a partir do catálogo JSON -->
        <section id="filter-section">
            <h2>Filtrar por Categoria</h2>
            <select id="category-filter" aria-label="Filtrar álbuns por categoria">
                <option value="">Todas as Categorias</option>
            </select>
        </section>

        <!-- Lista de álbuns criada dinamicamente pelo JavaScript -->
        <div id="product-list" aria-live="polite">
            <p class="mensagem-catalogo">A carregar catálogo...</p>
        </div>

        <!-- Calculadora do valor total da encomenda -->
        <div id="order-form">
            <h2>Calcular Valor Total</h2>
            <form id="calc-form" novalidate>
                <label for="product">Escolha um produto:</label>
                <select id="product" name="product">
                    <!-- Opções preenchidas a partir do catálogo JSON -->
                </select>

                <label for="quantity">Quantidade:</label>
                <div class="quantity-control">
                    <button type="button" id="decrease-quantity" aria-label="Diminuir quantidade">−</button>
                    <input type="number" id="quantity" name="quantity" min="1" step="1" value="1">
                    <button type="button" id="increase-quantity" aria-label="Aumentar quantidade">+</button>
                </div>

                <button type="submit" id="calculate">Calcular Valor</button>
            </form>
            <div id="total-value" aria-live="polite"></div>
        </div>
    </main>

    <!-- Janela de detalhes do álbum e navegação entre produtos -->
    <div id="lightbox" style="display:none;">
        <div class="lightbox-content">
            <button type="button" class="close-btn" aria-label="Fechar detalhes do álbum">&times;</button>
            <h2 id="lightbox-title">Detalhes do álbum</h2>

            <div class="lightbox-navegacao">
                <button type="button" id="album-anterior" class="seta-album" aria-label="Ver álbum anterior">
                    &#10094;
                </button>
                <img id="lightbox-image" src="imagens/capas/albumafro.webp" alt="Capa do álbum">
                <button type="button" id="album-seguinte" class="seta-album" aria-label="Ver álbum seguinte">
                    &#10095;
                </button>
            </div>

            <p id="lightbox-description"></p>
            <h3 id="lightbox-tracks-title">&#127925; Lista de músicas</h3>
            <ol id="lightbox-tracks"></ol>
            <p id="lightbox-price"></p>
        </div>
    </div>

    <!-- Rodapé: contacto e política de privacidade -->
    <footer class="footer-loja">
        <h3>LIURAME MUSIC</h3>
        <div>
            <a href="https://wa.me/351937774281" class="footer-whatsapp" target="_blank" rel="noopener noreferrer"
                aria-label="Contactar a LIURAME MUSIC pelo WhatsApp" title="WhatsApp">
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            </a>
        </div>
        <p class="footer-privacidade">
            &copy; 2026 LIURAME MUSIC. Todos os direitos reservados.
            <a href="documentos/politicaprivacidade.pdf" target="_blank" rel="noopener noreferrer">
                Política de Privacidade
            </a>
        </p>
    </footer>

    <!-- Funcionalidades do catálogo, lightbox e calculadora -->
    <script src="scripts.js"></script>
</body>

</html>
